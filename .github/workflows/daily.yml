name: Daily research run

on:
  schedule:
    # 05:23 Africa/Lagos = 04:23 UTC (WAT has no daylight saving). Off the top of the
    # hour because GitHub drops/delays on-the-hour schedules under load; ideas are
    # ready before 06:00 Lagos even if the run starts late.
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: print ideas, write nothing to Notion"
        type: boolean
        default: false
      sources:
        description: "Comma-separated subset of sources (blank = all)"
        type: string
        default: ""

concurrency:
  group: content-radar-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "latest"
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Run Content Radar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_IDEAS_DB_ID: ${{ secrets.NOTION_IDEAS_DB_ID }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          STACKEXCHANGE_KEY: ${{ secrets.STACKEXCHANGE_KEY }}
          # Built-in token: raises the GitHub Search API limit, no setup needed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.sources }}" ]; then ARGS="$ARGS --sources ${{ inputs.sources }}"; fi
          uv run python -m content_radar run $ARGS 2>&1 | tee run.log

      # Worth the Clone? repo scout. Runs even if the ideas run failed, and its own
      # failure doesn't hide the ideas run's result. Skips itself (and says so) when
      # NOTION_REPOS_DB_ID isn't set yet.
      - name: Run repo scout
        if: always()
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_REPOS_DB_ID: ${{ secrets.NOTION_REPOS_DB_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run --limit 10"; fi
          uv run python -m content_radar scout $ARGS 2>&1 | tee scout.log

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-log-${{ github.run_id }}
          path: |
            run.log
            scout.log
          retention-days: 14
