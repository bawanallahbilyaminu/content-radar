# Content Radar configuration. Secrets live in .env, never here.

run:
  max_ideas_per_run: 7
  lookback_hours: 48          # default window; a source may set its own lookback_hours
  timezone: Africa/Lagos
  user_agent: "content-radar/0.1 (+https://github.com/bawanallahbilyaminu/content-radar)"
  http_timeout_seconds: 20

models:
  filter: claude-haiku-5-5        # cheap per-item tagging / filtering, batched
  synthesize: claude-sonnet-5-5   # final idea synthesis
  filter_batch_size: 50

niche:
  # Used by keyword-driven collectors (HN, GitHub) and for niche_tags.
  keywords:
    - ai
    - artificial intelligence
    - llm
    - large language model
    - gpt
    - claude
    - gemini
    - llama
    - openai
    - anthropic
    - deepseek
    - mistral
    - machine learning
    - deep learning
    - neural network
    - transformer
    - rag
    - agents
    - agentic
    - mcp
    - fine-tuning
    - prompt
    - hugging face
    - pytorch
    - data science
    - data engineering
    - pandas
    - sql
    - dbt
    - spark
    - airflow
    - analytics
    - cybersecurity
    - infosec
    - ransomware
    - phishing
    - malware
    - vulnerability
    - cve
    - zero-day
    - exploit
    - breach
    - data leak
    - hacked
    - scam
  # Signals that an item already has a Nigeria / Africa angle.
  local_keywords:
    - nigeria
    - nigerian
    - lagos
    - abuja
    - kano
    - sokoto
    - africa
    - african
    - hausa
    - yoruba
    - igbo
    - swahili
    - ndpa
    - ndpc
    - nitda
    - cbn
    - naira
    - mtn
    - airtel
    - flutterwave
    - paystack
    - moniepoint
    - opay
    - palmpay
    - kuda
    - jumia
    - andela
    - interswitch
    - nimc
    - bvn
    - jamb
    - waec
    - kenya
    - ghana
    - south africa
    - egypt
    - m-pesa
  # Only community sources produce demand questions; news headlines ending in "?" do not.
  question_sources: [reddit, hackernews]
  # Title phrasing that marks a demand signal (question / help post).
  question_markers:
    - "?"
    - "how do i"
    - "how to"
    - "how can i"
    - "help"
    - "confused"
    - "should i"
    - "is it worth"
    - "what's the best"
    - "what is the best"
    - "why does"
    - "why is"
    - "anyone"
    - "advice"
    - "recommend"
    - "beginner"
    - "roadmap"
    - "explain"
    - "eli5"

sources:
  hackernews:
    enabled: true
    limit: 60
    min_points: 20
  github:
    enabled: true
    limit: 40
    created_within_days: 7
    min_stars: 30
    min_forks: 3              # star-farmed spam repos have hundreds of stars and zero forks
    topics:
      - llm
      - ai
      - machine-learning
      - agents
      - rag
      - mcp
      - security
      - cybersecurity
      - data-engineering
  huggingface:
    enabled: true
    limit: 30
    papers_limit: 20
    lookback_hours: 168       # daily papers lag a few days; trending models carry no date
  arxiv:
    enabled: true
    limit: 60
    lookback_hours: 120       # no announcements at weekends
    categories: [cs.AI, cs.LG, cs.CL, cs.CR]
  cisa_kev:
    enabled: true
    limit: 30
    lookback_hours: 168       # KEV additions are sparse
  rss:
    enabled: true
    limit: 25          # per feed
    feeds:
      - name: bleepingcomputer
        url: https://www.bleepingcomputer.com/feed/
        niche: cyber
      - name: thehackernews
        url: https://feeds.feedburner.com/TheHackersNews
        niche: cyber
      - name: krebs
        url: https://krebsonsecurity.com/feed/
        niche: cyber
      - name: techcrunch_ai
        url: https://techcrunch.com/category/artificial-intelligence/feed/
        niche: ai_ml
      - name: verge_ai
        url: https://www.theverge.com/rss/ai-artificial-intelligence/index.xml
        niche: ai_ml
      - name: techcabal
        url: https://techcabal.com/feed/
        niche: other
        local: true
      # techpoint.africa returns 403 to non-browser clients; listed but disabled.
      # - name: techpoint
      #   url: https://techpoint.africa/feed/
      #   niche: other
      #   local: true
  reddit:
    enabled: true
    limit: 40          # per subreddit per listing
    subreddits:
      - MachineLearning
      - LocalLLaMA
      - artificial
      - datascience
      - dataengineering
      - cybersecurity
      - netsec
      - Nigeria
    # Used when OAuth creds are missing: public RSS per subreddit.
    rss_fallback: true
  youtube:
    enabled: false     # Phase 5
