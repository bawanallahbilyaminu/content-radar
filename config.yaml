# Content Radar configuration. Secrets live in .env, never here.

run:
  max_ideas_per_run: 7
  lookback_hours: 48          # default window; a source may set its own lookback_hours
  timezone: Africa/Lagos
  user_agent: "content-radar/0.1 (+https://github.com/bawanallahbilyaminu/content-radar)"
  http_timeout_seconds: 20
  min_idea_score: 55          # ideas below this are dropped; fewer than 7 is fine
  breaking_window_hours: 48   # breaking = published within this AND (2+ sources | KEV | HN>=300)
  assumed_angle_max_points: 6 # local-angle points cap when the angle cites no local item

models:
  filter: claude-haiku-5-5        # cheap per-item tagging / filtering, batched
  synthesize: claude-sonnet-5-5   # final idea synthesis
  filter_batch_size: 50

llm:
  filter_top_items: 120          # best pre-scored items sent to the Haiku filter
  synthesize_top_clusters: 25    # best clusters sent to Sonnet
  filter_effort: low
  synthesize_effort: medium

budget:
  # Cost guard: if the projected run cost exceeds this, LLM steps are skipped and the
  # reason is logged. Estimates use the free count_tokens endpoint for input and the
  # figures below for output.
  max_cost_usd_per_run: 0.25
  pricing:                       # USD per 1M tokens (Anthropic first-party, 2026-11)
    claude-haiku-5-5: {input: 0.10, output: 0.50}
    claude-sonnet-5-5: {input: 2.00, output: 10.00}
  estimates:
    filter_output_per_item: 80
    synthesize_output_tokens: 7000
    synthesize_input_reserve: 14000

niche:
  # Used by keyword-driven collectors (HN, GitHub) and for niche_tags.
  keywords:
    - ai
    - artificial intelligence
    - llm
    - large language model
    - gpt
    - claude
    - gemini
    - llama
    - openai
    - anthropic
    - deepseek
    - mistral
    - machine learning
    - deep learning
    - neural network
    - transformer
    - rag
    - agents
    - agentic
    - mcp
    - fine-tuning
    - prompt
    - hugging face
    - pytorch
    - data science
    - data engineering
    - pandas
    - sql
    - dbt
    - spark
    - airflow
    - analytics
    - cybersecurity
    - infosec
    - ransomware
    - phishing
    - malware
    - vulnerability
    - cve
    - zero-day
    - exploit
    - breach
    - data leak
    - hacked
    - scam
  # Signals that an item already has a Nigeria / Africa angle.
  local_keywords:
    - nigeria
    - nigerian
    - lagos
    - abuja
    - kano
    - sokoto
    - africa
    - african
    - hausa
    - yoruba
    - igbo
    - swahili
    - ndpa
    - ndpc
    - nitda
    - cbn
    - naira
    - mtn
    - airtel
    - flutterwave
    - paystack
    - moniepoint
    - opay
    - palmpay
    - kuda
    - jumia
    - andela
    - interswitch
    - nimc
    - bvn
    - jamb
    - waec
    - kenya
    - ghana
    - south africa
    - egypt
    - m-pesa
  # Items from these sources are local evidence: a "sourced" angle must cite one of them
  # (or any item tagged local).
  local_sources:
    - rss:techcabal
    - rss:ndpc
    - rss:nitda
    - rss:techeconomy
    - rss:benjamindada
    - reddit:Nigeria
  # Only community sources produce demand questions; news headlines ending in "?" do not.
  question_sources: [reddit, hackernews, stackexchange]
  # Title phrasing that marks a demand signal (question / help post).
  question_markers:
    - "?"
    - "how do i"
    - "how to"
    - "how can i"
    - "help"
    - "confused"
    - "should i"
    - "is it worth"
    - "what's the best"
    - "what is the best"
    - "why does"
    - "why is"
    - "anyone"
    - "advice"
    - "recommend"
    - "beginner"
    - "roadmap"
    - "explain"
    - "eli5"

sources:
  hackernews:
    enabled: true
    limit: 60
    min_points: 20
  github:
    enabled: true
    limit: 40
    created_within_days: 7
    lookback_hours: 168       # repos created this week, not just the last 48h
    min_stars: 30
    min_forks: 3              # star-farmed spam repos have hundreds of stars and zero forks
    topics:
      - llm
      - ai
      - machine-learning
      - agents
      - rag
      - mcp
      - security
      - cybersecurity
      - data-engineering
  huggingface:
    enabled: true
    limit: 30
    papers_limit: 20
    lookback_hours: 168       # daily papers lag a few days; trending models carry no date
  arxiv:
    enabled: true
    limit: 60
    lookback_hours: 120       # no announcements at weekends
    categories: [cs.AI, cs.LG, cs.CL, cs.CR]
  cisa_kev:
    enabled: true
    limit: 30
    lookback_hours: 168       # KEV additions are sparse
  rss:
    enabled: true
    limit: 25          # per feed
    feeds:
      - name: bleepingcomputer
        url: https://www.bleepingcomputer.com/feed/
        niche: cyber
      - name: thehackernews
        url: https://feeds.feedburner.com/TheHackersNews
        niche: cyber
      - name: krebs
        url: https://krebsonsecurity.com/feed/
        niche: cyber
      - name: techcrunch_ai
        url: https://techcrunch.com/category/artificial-intelligence/feed/
        niche: ai_ml
      - name: verge_ai
        url: https://www.theverge.com/rss/ai-artificial-intelligence/index.xml
        niche: ai_ml
      - name: techcabal
        url: https://techcabal.com/feed/
        niche: other
        local: true
      # --- Nigerian sources with real feeds (verified 2026-11-09) ---
      - name: ndpc
        url: https://ndpc.gov.ng/feed/
        niche: cyber
        local: true
      - name: nitda
        url: https://nitda.gov.ng/feed/
        niche: other
        local: true
      - name: techeconomy
        url: https://techeconomy.ng/feed.xml
        niche: other
        local: true
      - name: benjamindada
        url: https://www.benjamindada.com/rss/
        niche: other
        local: true
      # ngCERT (cert.gov.ng) returns 403 to non-browser clients: no feed available, skipped.
      # techpoint.africa returns 403 to non-browser clients; listed but disabled.
      # - name: techpoint
      #   url: https://techpoint.africa/feed/
      #   niche: other
      #   local: true
  reddit:
    enabled: true
    limit: 40          # per subreddit per listing
    # App-only (client_credentials) read-only OAuth. Post-level fields only:
    # title, url, score, num_comments, created_utc, flair. No authors, no bodies.
    subreddits:
      - MachineLearning
      - LocalLLaMA
      - artificial
      - datascience
      - dataengineering
      - cybersecurity
      - netsec
      - Nigeria
    # Used when OAuth creds are missing or refused: public Atom feed per subreddit.
    rss_fallback: true
    rss_delay_seconds: 6      # anonymous feed requests are rate-limited; space them out
  stackexchange:
    enabled: true
    limit: 60                 # total after ranking by votes
    lookback_hours: 720       # pipeline window for the whole source; sites narrow it below
    pagesize: 30
    min_score: 1              # default vote floor; small sites override below
    min_quota_remaining: 20   # stop early rather than exhaust the 300/day anonymous quota
    sites:
      - site: stackoverflow
        tags:
          - pytorch
          - huggingface-transformers
          - large-language-model
          - langchain
          - scikit-learn
          - ollama
          - pandas
          - polars
          - powerbi
          - docker
        lookback_hours: 168   # high traffic: last week is plenty
      # Low-traffic sites: a handful of questions a week, mostly 0 votes. Views still
      # signal demand, so take everything from the last 30 days.
      - site: datascience
        min_score: 0
        lookback_hours: 720
      - site: security
        min_score: 0
        lookback_hours: 720
      - site: ai
        min_score: 0
        lookback_hours: 720
  youtube:
    enabled: false     # Phase 5
